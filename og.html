<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=600,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600&family=Rozha+One&family=Yellowtail&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:600px;height:315px;overflow:hidden;background:#0e0408}
.c{position:relative;width:600px;height:315px;display:grid;place-items:center;text-align:center;color:#f1e6d6;overflow:hidden}
.c img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 38%;filter:saturate(.8) contrast(1.06)}
.c::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,4,8,.7),rgba(96,12,32,.55) 50%,rgba(14,4,8,.92))}
.in{position:relative;display:grid;justify-items:center;gap:0}
.logo{width:54px;height:54px;border-radius:50%;border:2px solid #f1e6d6;margin-bottom:8px}
.kick{font:600 9.5px 'Hanken Grotesk',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#f0d2a6}
h1{font:400 78px/1 'Rozha One',serif;margin:4px 0 0;text-shadow:0 6px 26px rgba(0,0,0,.55)}
.s{font:400 31px/1 'Yellowtail',cursive;color:#f0d2a6;margin-top:2px;text-shadow:0 0 14px rgba(217,165,102,.6)}
.f{position:absolute;bottom:14px;left:0;right:0;font:600 10px 'Hanken Grotesk',sans-serif;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
</style></head><body>
<div class="c">
  <img class="bg" src="img/grupo.jpg" alt="">
  <div class="in">
    <img class="logo" src="img/logo.jpg" alt="">
    <p class="kick">Salón de despecho · Música en vivo</p>
    <h1>Entre Copas</h1>
    <p class="s">canta, brinda y supéralo</p>
  </div>
  <p class="f">Maracay · Frente a la Plaza San Juan</p>
</div>
</body></html>
